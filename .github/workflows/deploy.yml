name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Security Audits (non-blocking warnings only) ──────────────────
      - name: Security Audit — Backend
        continue-on-error: true
        run: |
          cd toyventure-server
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found"

      - name: Security Audit — Frontend
        continue-on-error: true
        run: |
          cd toyventure-client
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found"

      # ── Build Frontend on GitHub's fast runner ────────────────────────
      - name: Build Frontend
        run: |
          cd toyventure-client
          npm install --legacy-peer-deps
          npm run build

      # ── Upload pre-built dist/ to EC2 via SCP ────────────────────────
      - name: Upload dist/ to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "toyventure-client/dist/."
          target: "/home/ubuntu/akshar_dist_upload"
          strip_components: 2

      # ── SSH: Sync backend, copy dist, reload nginx ───────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 1. Pull latest code
            cd /home/ubuntu/akshar_
            git fetch origin main
            git reset --hard origin/main

            # 2. Nginx SPA config
            sudo cp /home/ubuntu/akshar_/nginx/default.conf /etc/nginx/sites-available/default
            sudo nginx -t

            # 3. Backend — only npm install (no build needed)
            cd toyventure-server
            npm install --legacy-peer-deps
            command -v pm2 &>/dev/null || npm install -g pm2
            pm2 restart all || pm2 start server.js --name "toyblix-server"
            pm2 save

            # 4. Swap in new frontend build
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/akshar_dist_upload/. /var/www/html/
            rm -rf /home/ubuntu/akshar_dist_upload

            # 5. Reload nginx
            sudo systemctl restart nginx
            echo "✅ Deployed Successfully!"
