name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code securely
        uses: actions/checkout@v4
      
      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Backend Dependencies (Gate)
        run: |
          cd toyventure-server
          npm audit --audit-level=high

      - name: Audit Frontend Dependencies (Gate)
        run: |
          cd toyventure-client
          npm audit --audit-level=high

  deploy:
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH Action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1. Enter the project directory
            cd /home/ubuntu/akshar_
            
            # 2. Pull the latest changes securely
            git pull origin main --rebase
            
            # Load Node Environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 3. Setup and Restart Backend using PM2 Process Manager
            echo "Preparing backend..."
            cd toyventure-server
            npm install
            
            if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2..."
                npm install -g pm2
            fi
            
            # Try to restart the existing process, or start a new one
            pm2 restart all || pm2 start server.js --name "toyblix-server"
            pm2 save
            
            # 5. Write Nginx config to support React Router (SPA fallback)
            echo "Configuring Nginx for SPA routing..."
            sudo bash -c 'cat > /etc/nginx/sites-available/default <<EOF
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # React Router SPA fallback — serve index.html for all unknown paths
    location / {
        try_files \$uri \$uri/ /index.html;
    }

    # Proxy API requests to the Node.js backend
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host \$host;
        proxy_cache_bypass \$http_upgrade;
    }

    # Proxy uploads/static assets served by Express
    location /uploads/ {
        proxy_pass http://localhost:5000/uploads/;
        proxy_set_header Host \$host;
    }
}
EOF'

            # 6. Transfer to Nginx & Bounce Web Server
            echo "Preparing frontend..."
            cd ../toyventure-client
            npm install
            npm run build

            sudo cp -r dist/* /var/www/html/
            sudo nginx -t && sudo systemctl restart nginx
            
            echo "✅ Deployment Completed Successfully!"
