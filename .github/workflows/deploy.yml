name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH Action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1. Enter the project directory
            cd /home/ubuntu/akshar_
            
            # 2. Pull the latest changes securely
            git pull origin main --rebase
            
            # Load Node Environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 3. Setup and Restart Backend using PM2 Process Manager
            echo "Preparing backend..."
            cd toyventure-server
            npm install
            
            if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2..."
                npm install -g pm2
            fi
            
            # Try to restart the existing process, or start a new one
            pm2 restart all || pm2 start server.js --name "toyblix-server"
            pm2 save
            
            # 4. Setup and Build Frontend UI
            echo "Preparing frontend..."
            cd ../toyventure-client
            npm install
            npm run build

            # 5. Transfer to Nginx & Bounce Web Server
            sudo cp -r dist/* /var/www/html/
            sudo systemctl restart nginx
            
            echo "✅ Deployment Completed Successfully!"
