name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Audit, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Security Audit — Backend (non-blocking)
        continue-on-error: true
        run: |
          cd toyventure-server
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found — check logs"

      - name: Security Audit — Frontend (non-blocking)
        continue-on-error: true
        run: |
          cd toyventure-client
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found — check logs"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e

            # 1. Enter project & sync with remote
            cd /home/ubuntu/akshar_
            git fetch origin main
            git reset --hard origin/main

            # Load NVM / Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Backend — install & restart
            echo "--- Backend ---"
            cd toyventure-server
            npm install --legacy-peer-deps
            command -v pm2 &>/dev/null || npm install -g pm2
            pm2 restart all || pm2 start server.js --name "toyblix-server"
            pm2 save

            # 3. Nginx — SPA fallback config
            echo "--- Nginx ---"
            sudo cp /home/ubuntu/akshar_/nginx/default.conf /etc/nginx/sites-available/default
            sudo nginx -t

            # 4. Frontend — install, build, deploy
            echo "--- Frontend ---"
            cd /home/ubuntu/akshar_/toyventure-client
            npm install --legacy-peer-deps
            npm run build
            ls dist/

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/. /var/www/html/
            sudo systemctl restart nginx

            echo "✅ Deployed Successfully!"
