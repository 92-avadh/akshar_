name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Security Audits (non-blocking) ────────────────────────────────
      - name: Security Audit — Backend
        continue-on-error: true
        run: |
          cd toyventure-server
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found"

      - name: Security Audit — Frontend
        continue-on-error: true
        run: |
          cd toyventure-client
          npm install --legacy-peer-deps --silent
          npm audit --audit-level=critical || echo "⚠️ Audit warnings found"

      # ── Build Frontend on fast GitHub runner ──────────────────────────
      - name: Build Frontend
        run: |
          cd toyventure-client
          npm install --legacy-peer-deps
          npm run build
          echo "✅ Build complete"
          ls dist/

      # ── Transfer dist/ to EC2 via native SCP ─────────────────────────
      - name: Upload dist to EC2
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          tar -czf /tmp/dist.tar.gz -C toyventure-client/dist .
          scp -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              /tmp/dist.tar.gz \
              ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/dist.tar.gz
          rm -f /tmp/deploy_key /tmp/dist.tar.gz

      # ── SSH: sync backend, extract dist, reload nginx ─────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 1. Sync latest code (for backend + nginx config)
            cd /home/ubuntu/akshar_
            git fetch origin main
            git reset --hard origin/main

            # 2. Nginx SPA config
            sudo cp /home/ubuntu/akshar_/nginx/default.conf /etc/nginx/sites-available/default
            sudo nginx -t

            # 3. Backend — install & restart
            cd /home/ubuntu/akshar_/toyventure-server
            npm install --legacy-peer-deps
            command -v pm2 &>/dev/null || npm install -g pm2
            pm2 restart all || pm2 start server.js --name "toyblix-server"
            pm2 save

            # 4. Deploy pre-built frontend
            sudo rm -rf /var/www/html/*
            sudo tar -xzf /home/ubuntu/dist.tar.gz -C /var/www/html/
            rm -f /home/ubuntu/dist.tar.gz

            # 5. Restart nginx
            sudo systemctl restart nginx
            echo "✅ Deployed Successfully!"
